spec_quote = "- **A v2 task that declares `blocks` is invalid.** As with `mode`, the field is rejected"
passing = "v2-baseline"
covers = ["- **A v2 task that declares `blocks` is invalid.** As with `mode`, the field is rejected"]

[[case]]
id = "v2-task-declares-blocks"
rule = "v2-task-blocks-rejected"
baseline = "2026-09-10-format-v2-baseline.md"
expect = "invalid"
find = "    depends_on: []\n"
replace = "    depends_on: []\n    blocks:\n      - T002\n"
diagnostic.planner = "task T001 declares 'blocks', which Planning Document Format v2 removed. It is the exact inverse of depends_on and is derived on projection, never authored. Delete it."
diagnostic.check_plan = "task T001 declares 'blocks', which Planning Document Format v2 removed. It is the exact inverse of depends_on and is derived on projection, never authored. Delete it."

