# --- Statements the spec makes that carry no fixture --------------------------
#
# Named here so the absence is a recorded decision rather than an omission.

[[unfixtured]]
statement = "- **Failure dispositions** — the closed vocabulary a worker reports its outcome from."
reason = "A plan does not carry a failure disposition; the vocabulary binds a worker's submit, so no plan can violate it."

[[unfixtured]]
statement = "- **Status transition rules** — the guidance transitions, and the requirement that a"
reason = "Stated in the v1 section as guidance, not as an enforced rule; neither validator checks it."

[[unfixtured]]
statement = "- **What the validator does not check** — structure, not judgment."
reason = "A statement of scope rather than a rule; it has no violating document."

[[unfixtured]]
statement = "- Read the full plan and verify a task's dependencies are `done` before starting it."
reason = "The Execution Protocol contract's six bullets constrain the prose a plan carries, and neither validator reads that prose; only the section's presence is enforced, by v2-execution-protocol-required."
