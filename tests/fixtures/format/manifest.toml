# Planning Document Format cross-validator fixture manifest.
#
# Two independent implementations have decided whether a document is a valid
# plan: a `check-plan` Python validator, now retired, and the `planner` crate. A
# document that passes one and fails the other makes validity a function of which
# tool ran, so this manifest is the one artifact every validator reads. A consumer
# that pins a planner build can run the same table against that build.
#
# A `case` is a baseline document with one anchor replaced, so a verdict is
# attributable to exactly one rule. A harness materialises each case, runs its
# validator over it, and compares the verdict to `expect`.
#
# A `rule` names one statement the Planning Document Format v2 section of
# PLAN_SPEC.md makes. `spec_quote` must occur verbatim in that section; `covers`
# lists the enforced statements the rule accounts for, and every statement in the
# spec's five enforced lists is claimed by exactly one rule.
#
# `diagnostic` pins the message each validator emits, so the table records which
# rule fired in each implementation and not merely that something did. The two
# validators word most of their diagnostics differently; where the spec mandates
# the wording -- the two `removed in v2` messages -- they are identical.
#
# `divergence` records a validator that does NOT agree, with the decision that
# dispositioned it. A divergence is documented here, never resolved by weakening
# the fixture: the case still says what the spec says, and the field records which
# implementation does not yet enforce it.

version = 1

# --- Baseline documents -------------------------------------------------------

[[case]]
id = "v2-baseline"
baseline = "2026-09-10-format-v2-baseline.md"
expect = "valid"
why = "The v2 document every v2 case is one edit away from."

[[case]]
id = "v2-frontmatter-unknown-key"
baseline = "2026-09-10-format-v2-baseline.md"
expect = "valid"
find = "status: approved\n"
replace = "status: approved\nextra_note: tolerated by v2\n"
why = "An unknown key that is not `mode` is tolerated."

[[case]]
id = "v2-verdict-recorded"
baseline = "2026-09-10-format-v2-baseline.md"
expect = "valid"
find = "        counterfactual: A worker given the canary could optimize output around it.\n"
replace = "        counterfactual: A worker given the canary could optimize output around it.\n        verdict: pass\n        rationale: The canary was absent from every artefact.\n"
why = "A ledger-written verdict on a hidden criterion."

# --- v1 regression and known v1 divergences -----------------------------------
#
# v2 was added beside v1, never over it. These cases ask both validators the v1
# question, and pin the three places where the two already disagreed on v1 before
# this fixture corpus existed.

[[case]]
id = "v1-single-baseline"
baseline = "2026-09-10-format-v1-single-baseline.md"
expect = "valid"
why = "A `mode: single` v1 plan validates unchanged after v2 exists."

[[case]]
id = "v1-multi-baseline"
baseline = "2026-09-10-format-v1-multi-baseline.md"
expect = "valid"
why = "A `mode: multi` v1 plan, with authored `blocks`, validates unchanged after v2 exists."

[[case]]
id = "v1-single-mode-absent"
baseline = "2026-09-10-format-v1-single-baseline.md"
expect = "invalid"
find = "mode: single\n"
replace = ""
why = "v1 still requires the key v2 rejects."
diagnostic.planner = "frontmatter missing required key: mode"
diagnostic.check_plan = "frontmatter missing required key: mode"

[[case]]
id = "v1-multi-files-empty-mapping"
baseline = "2026-09-10-format-v1-multi-baseline.md"
expect = "invalid"
find = "    files:\n      likely_read:\n        - src/markdown.rs\n      likely_modify: []\n"
replace = "    files: {}\n"
divergence = "planner"
why = "Known v1 divergence, recorded by T005 deviation 4: planner defaults the two keys under v1."
diagnostic.check_plan = "task T001 files must be a mapping with likely_read and likely_modify lists"

[[case]]
id = "v1-multi-owner-key-absent"
baseline = "2026-09-10-format-v1-multi-baseline.md"
expect = "invalid"
find = "    status: not_started\n    owner: null\n"
replace = "    status: not_started\n"
divergence = "planner"
why = "Known v1 divergence, recorded by T005 deviation 4: planner defaults the key under v1."
diagnostic.check_plan = "task T001 missing required field: owner"

[[case]]
id = "v1-version-float"
baseline = "2026-09-10-format-v1-single-baseline.md"
expect = "invalid"
find = "plan_format_version: 1"
replace = "plan_format_version: 1.0"
divergence = "check-plan"
why = "Known v1 divergence, recorded by D010: `1.0 != 1` is false in Python, so check-plan accepts it."
diagnostic.planner = "plan_format_version: invalid type: floating point `1.0`, expected u32 at line 1 column 22"

