replace = "status: approved\nmode: multi\n"
diagnostic.planner = "frontmatter declares 'mode', which Planning Document Format v2 removed. Concurrency is a property of how a plan is executed, not of the document; v2 has one shape. Delete the key."
diagnostic.check_plan = "frontmatter declares 'mode', which Planning Document Format v2 removed. Concurrency is a property of how a plan is executed, not of the document; v2 has one shape. Delete the key."

