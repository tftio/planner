diagnostic.check_plan = "task T001 declares 'files', which Planning Document Format v2 removed. It asked for a forecast of the files the task would touch; v2 requires the completion evidence to name the files it actually touched instead. Delete it."

# Worker projection leaves v2 entirely. One case per field rather than one for
# the rule: the spec requires the diagnostic to name the version and the field,
# so a single case would leave three of the four wordings unpinned.

[[rule]]
id = "v2-task-worker-projection-rejected"
spec_quote = "- **A v2 task that declares `seed`, `allow`, `guest_class` or `seed_includes_plans` is"
passing = "v2-baseline"
covers = ["- **A v2 task that declares `seed`, `allow`, `guest_class` or `seed_includes_plans` is"]

[[case]]
id = "v2-task-declares-seed"
rule = "v2-task-worker-projection-rejected"
baseline = "2026-09-10-format-v2-baseline.md"
expect = "invalid"
find = "    status: not_started\n    owner: null\n"
replace = "    status: not_started\n    owner: null\n    seed:\n      - src\n"
diagnostic.planner = "task T001 declares 'seed', which Planning Document Format v2 removed. v2 has no worker projection: the projection strips hidden_criteria unconditionally and no field widens what a worker may see. Delete it."
diagnostic.check_plan = "task T001 declares 'seed', which Planning Document Format v2 removed. v2 has no worker projection: the projection strips hidden_criteria unconditionally and no field widens what a worker may see. Delete it."

