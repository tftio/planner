divergence = "check-plan"
why = "check-plan does not model project yet (T011). planner requires project.remote to already be normalized: normalize_remote(remote) must equal remote."
diagnostic.planner = "project.remote \"git@github.com:tftio/kb.git\" unnormalized: expected github.com/tftio/kb"

