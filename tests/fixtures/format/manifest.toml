[[rule]]
id = "v2-frontmatter-required-keys"
spec_quote = "- Required keys, exactly these: `plan_format_version`, `plan_id`, `title`, `status`,"
passing = "v2-baseline"
covers = ["- Required keys, exactly these: `plan_format_version`, `plan_id`, `title`, `status`,"]

