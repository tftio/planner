covers = ["- **A v2 task that declares `files` is invalid.** As with `mode`, the field is rejected"]

[[case]]
id = "v2-task-declares-files"
rule = "v2-task-files-rejected"
baseline = "2026-09-10-format-v2-baseline.md"
expect = "invalid"
find = "    work_items:\n      - Read the frontmatter under the v2 rule set.\n"
