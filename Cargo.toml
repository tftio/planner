[package]
name = "tftio-planner"
version = "0.5.4"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Authoritative planning-document library and CLI"
repository = "https://github.com/tftio/planner"
homepage = "https://github.com/tftio/planner"
readme = "README.md"
keywords = ["rust"]
categories = ["development-tools"]
# Not published to crates.io while the GitHub repository is the distribution
# channel. Revisit before re-enabling.
publish = false
# Package only what builds the crate. Without this list `cargo package` ships
# every tracked file, including the test suite. The two test fixtures are here
# because `src/` embeds them with `include_str!`.
include = [
  "src/**",
  "resources/**",
  "tests/fixtures/valid-single.md",
  "tests/fixtures/legacy/2026-06-22-hidden-criteria-valid.md",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
]

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
dbg_macro = "deny"
enum_glob_use = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[lib]
name = "tftio_planner"
path = "src/lib.rs"

[[bin]]
name = "planner"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap_complete = "4"
tftio-lib = "0.4"

[dev-dependencies]
assert_cmd = "2"
proptest = "1"
# Reads tests/fixtures/format/manifest.toml, the cross-validator fixture
# contract that any planner consumer can run against its pinned build.
toml = "0.9"
